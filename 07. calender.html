<!DOCTYPE html>
<html>>
<head>
	<title>Calender</title>
	<style>
	    table {
	        border-collapse: collapse;
	        width: 400px;
	        text-align: center;
	    }

	    th, td {
	        border: 1px solid black;
	        padding: 12px;
	    }

	    th {
	        background-color: lightblue;
	    }

	    td {
	        height: 30px;
	    }
	</style>
</head>
<h2>Calendar Generator</h2>

Enter Year:
<input type="number" id="year"><br><br>

Enter Month (1 - 12):
<input type="number" id="month"><br><br>

<button onclick="generate()">Generate Calendar</button>

<h3 id="heading"></h3>

<div id="result"></div>

<script>

    function generate()
    {
        let y = document.getElementById("year").value;
        let m = document.getElementById("month").value;

        if(y == "" || m == "" || m < 1 || m > 12)
        {
            alert("Enter valid year and month");
            return;
        }

        let first = new Date(y, m-1, 1).getDay();

        let days = new Date(y, m, 0).getDate();

        let cal = "<table>";

        cal += "<tr>";
        cal += "<th>Sunday</th>";
        cal += "<th>Monday</th>";
        cal += "<th>Tuesday</th>";
        cal += "<th>Wednesday</th>";
        cal += "<th>Thursday</th>";
        cal += "<th>Friday</th>";
        cal += "<th>Saturday</th>";
        cal += "</tr>";

        let date = 1;

        for(let i = 0; i < 6; i++)
        {
            cal += "<tr>";

            for(let j = 0; j < 7; j++)
            {
                if((i == 0 && j < first) || date > days)
                {
                    cal += "<td></td>";
                }
                else
                {
                    cal += "<td>" + date + "</td>";
                    date++;
                }
            }

            cal += "</tr>";

            if(date > days)
            {
                break;
            }
        }

        cal += "</table>";

        document.getElementById("heading").innerHTML =
            "Calendar: " + m + "/" + y;

        document.getElementById("result").innerHTML = cal;
    }

</script>
</body>
</html>
