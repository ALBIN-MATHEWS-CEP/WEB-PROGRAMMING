<html>
<head>
    <title>Tags Demonstration</title>
</head>

<body>

    <h1>Tags HTML Tags</h1>

    <h2>Heading Tags</h2>
    <h3>3rd Tag</h3>

    <p>This is a paragraph</p>

    <b>This text is bold</b>

    <i>This text is italic</i>

    <u>This text is underlined</u>

    <h2>List</h2>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
    </ol>

    <ul>
        <h2>Unordered List</h2>
        <li>Python</li>
        <li>Java</li>
    </ul>

    <h2>Image</h2>
    <img src="img.jpg" alt="sample" width="200">

    <h2>Horizontal Line</h2>
    <hr>

    <p>H<sub>2</sub>O</p>

    <p>x<sup>2</sup> + y<sup>2</sup></p>

</body>
</html>
