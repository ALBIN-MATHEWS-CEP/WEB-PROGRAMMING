<html>
<head>
    <title>Different Types of Frames</title>
</head>

<frameset rows="20%,80%">

    <!-- Top Frame -->
    <frame src="top.html">

    <!-- Mixed Frames: 30% navigation + 70% main -->
    <frameset cols="30%,70%">

        <!-- Navigation Frame -->
        <frame src="navigation.html">

        <!-- Main Frame -->
        <frame src="home.html" name="main">

    </frameset>

</frameset>

</html>
